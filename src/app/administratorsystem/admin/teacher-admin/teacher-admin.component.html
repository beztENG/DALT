<div>
  <h2>Lịch Giáo Viên</h2>

  <!-- Add Teacher Modal -->
  <div class="nenmodal" id="addTeacherModal">
    <div class="nenmodal2" (click)="toggleAddTeacherModal()"></div>
    <div class="ndmodal">
      <div class="closemodal">
        <button (click)="toggleAddTeacherModal()">×</button>
      </div>
      <div *ngIf="selectedDate" class="form-container">
        <h3>Thêm Giáo Viên cho {{ selectedDate }}</h3>
        <form (ngSubmit)="addTeacher()">
          <label>Tên:</label>
          <input [(ngModel)]="newTeacher.name" name="name" required>
          <label>Số Điện Thoại:</label>
          <input [(ngModel)]="newTeacher.phoneNum" name="phoneNum" required>
          <label>Lớp Dạy:</label>
          <select [(ngModel)]="newTeacher.teachingClass" name="teachingClass" required>
            <option *ngFor="let class of classes" [value]="class.classId">{{ class.courseId + class.classId }}</option>
          </select>
          <label>Thời Lượng:</label>
          <input [(ngModel)]="newTeacher.duration" name="duration" required>
          <label>Thời Gian:</label>
          <input [(ngModel)]="newTeacher.timeline" name="timeline" placeholder="ví dụ: 3:00pm - 5:00pm" required>
          <div class="form-buttons">
            <button type="submit">Thêm</button>
            <button type="button" (click)="toggleAddTeacherModal()">Hủy</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Edit Teacher Modal -->
  <div class="nenmodal" id="editTeacherModal">
    <div class="nenmodal2" (click)="toggleEditTeacherModal()"></div>
    <div class="ndmodal">
      <div class="closemodal">
        <button (click)="toggleEditTeacherModal()">×</button>
      </div>
      <div *ngIf="selectedTeacher" class="form-container">
        <h3>Chỉnh Sửa Giáo Viên</h3>
        <form (ngSubmit)="updateTeacher()">
          <label>Tên:</label>
          <input [(ngModel)]="selectedTeacher.name" name="name" required>
          <label>Số Điện Thoại:</label>
          <input [(ngModel)]="selectedTeacher.phoneNum" name="phoneNum" required>
          <label>Lớp Dạy:</label>
          <select [(ngModel)]="selectedTeacher.teachingClass" name="teachingClass" required>
            <option *ngFor="let class of classes" [value]="class.classId">{{ class.courseId + class.classId }}</option>
          </select>
          <label>Thời Lượng:</label>
          <input [(ngModel)]="selectedTeacher.duration" name="duration" required>
          <label>Thời Gian:</label>
          <input [(ngModel)]="selectedTeacher.timeline" name="timeline" placeholder="ví dụ: 3:00pm - 5:00pm" required>
          <div class="form-buttons">
            <button type="submit">Cập Nhật</button>
            <button type="button" (click)="cancelEdit()">Hủy</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div>
    <h3>{{ currentYear }} - {{ currentMonth + 1 }}</h3>
    <table>
      <thead>
        <tr>
          <th *ngFor="let day of ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']">{{ day }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let week of getCalendarWeeks()">
          <td *ngFor="let day of week" (click)="day !== null && selectDay(day)" [class.selected]="day === selectedDate">
            <div>
              <span *ngIf="day !== null">{{ day }}</span>
              <div *ngIf="day !== null">
                <div *ngFor="let teacher of getTeachersForDay(day)" class="teacher-info">
                  <div>{{ teacher.name }}</div>
                  <div>{{ teacher.teachingClass }}</div>
                  <div class="teacher-timeline">{{ teacher.timeline }}</div>
                  <div class="teacher-buttons">
                    <button (click)="editTeacher(teacher)">Chỉnh Sửa</button>
                    <button (click)="deleteTeacher(teacher._id!)">Xóa</button>
                  </div>
                </div>
              </div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="nav-buttons">
      <button class="nav-button" (click)="previousMonth()">Tháng Trước</button>
      <button class="nav-button" (click)="nextMonth()">Tháng Sau</button>
    </div>
  </div>
</div>
