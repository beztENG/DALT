<div>
  <h2>Teacher Calendar</h2>

  <div *ngIf="selectedDate" class="form-container">
    <h3>Add Teacher for {{ selectedDate }}</h3>
    <form (ngSubmit)="addTeacher()">
      <label>Name:</label>
      <input [(ngModel)]="newTeacher.name" name="name" required>
      <label>Phone Number:</label>
      <input [(ngModel)]="newTeacher.phoneNum" name="phoneNum" required>
      <label>Teaching Class:</label>
      <select [(ngModel)]="newTeacher.teachingClass" name="teachingClass" required>
        <option *ngFor="let class of classes" [value]="class.classId ">{{ class.courseId + class.classId }}</option>
      </select>
      <label>Duration:</label>
      <input [(ngModel)]="newTeacher.duration" name="duration" required>
      <label>Timeline:</label>
      <input [(ngModel)]="newTeacher.timeline" name="timeline" placeholder="e.g., 3:00pm - 5:00pm" required>
      <div class="form-buttons">
        <button type="submit">Thêm</button>
        <button type="button" (click)="cancelAdd()">Hủy</button>
      </div>
    </form>
  </div>

  <div *ngIf="selectedTeacher" class="form-container">
    <h3>Edit Teacher</h3>
    <form (ngSubmit)="updateTeacher()">
      <label>Name:</label>
      <input [(ngModel)]="selectedTeacher.name" name="name" required>
      <label>Phone Number:</label>
      <input [(ngModel)]="selectedTeacher.phoneNum" name="phoneNum" required>
      <label>Teaching Class:</label>
      <select [(ngModel)]="selectedTeacher.teachingClass" name="teachingClass" required>
        <option *ngFor="let class of classes" [value]="class.classId">{{ class.courseId + class.classId }}</option>
      </select>
      <label>Duration:</label>
      <input [(ngModel)]="selectedTeacher.duration" name="duration" required>
      <label>Timeline:</label>
      <input [(ngModel)]="selectedTeacher.timeline" name="timeline" placeholder="e.g., 3:00pm - 5:00pm" required>
      <div class="form-buttons">
        <button type="submit">Update</button>
        <button type="button" (click)="cancelEdit()">Cancel</button>
      </div>
    </form>
  </div>

  <div>
    <h3>{{ currentYear }} - {{ currentMonth + 1 }}</h3>
    <table>
      <thead>
        <tr>
          <th *ngFor="let day of ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']">{{ day }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let week of getCalendarWeeks()">
          <td *ngFor="let day of week" (click)="day !== null && selectDay(day)" [class.selected]="day === selectedDate">
            <div>
              <span *ngIf="day !== null">{{ day }}</span>
              <div *ngIf="day !== null">
                <div *ngFor="let teacher of getTeachersForDay(day)" class="teacher-info">
                  <div>{{ teacher.name }}</div>
                  <div>{{ teacher.teachingClass }}</div>
                  <div class="teacher-timeline">{{ teacher.timeline }}</div>
                  <div class="teacher-buttons">
                    <button (click)="editTeacher(teacher)">Edit</button>
                    <button (click)="deleteTeacher(teacher._id!)">Delete</button>
                  </div>
                </div>
              </div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="nav-buttons">
      <button class="nav-button" (click)="previousMonth()">Previous Month</button>
      <button class="nav-button" (click)="nextMonth()">Next Month</button>
    </div>
  </div>
</div>
