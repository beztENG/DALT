<h2>Danh sách Sinh viên</h2>

<input type="text" [(ngModel)]="searchKeyword" (input)="search()" placeholder="Tìm kiếm...">

<button (click)="loadStudents()">Sắp xếp theo thời gian đăng ký</button>
<button (click)="search()">Tìm kiếm</button>

<button routerLink="/add-student">Thêm Sinh Viên</button>

<div *ngIf="selectedStudent">
    <h3>Cập Nhật Thông Tin Sinh Viên</h3>
    <form #editStudentForm="ngForm" (ngSubmit)="updateStudent(editStudentForm.value)">
        <input type="hidden" name="studentId" [(ngModel)]="selectedStudent.studentId">

        <label for="studentName">Tên sinh viên:</label>
        <input type="text" id="studentName" name="studentName" [(ngModel)]="selectedStudent.studentName" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" [(ngModel)]="selectedStudent.email" required>

        <label for="password">Mật khẩu:</label>
        <input type="password" id="password" name="password" [(ngModel)]="selectedStudent.password" required>

        <label for="phoneNumber">Số điện thoại:</label>
        <input type="text" id="phoneNumber" name="phoneNumber" [(ngModel)]="selectedStudent.phoneNumber" required>

        <label for="registrationDate">Ngày đăng ký:</label>
        <input type="date" id="registrationDate" name="registrationDate" [(ngModel)]="selectedStudent.registrationDate"
            required>

        <button type="submit">Lưu</button>
        <button type="button" (click)="cancelEdit()">Huỷ</button>
    </form>
</div>
<table class="student-table">
    <thead>
        <tr>
            <th>Mã SV</th>
            <th>Tên sinh viên</th>
            <th>Email</th>
            <th>Số điện thoại</th>
            <th>Thời gian đăng ký</th>
            <th>Chức năng</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let student of students">
            <td>{{ student.studentId }}</td>
            <td>{{ student.studentName }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.phoneNumber }}</td>
            <td>{{ student.registrationDate | date: 'dd/MM/yyyy' }}</td>
            <td>
                <button (click)="deleteStudent(student.studentId)" class="btn-delete">Xóa</button>
                <button (click)="openEditStudentForm(student)" class="btn-edit">Sửa</button>
            </td>
        </tr>
    </tbody>
</table>
