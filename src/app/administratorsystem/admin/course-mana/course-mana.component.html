<h2>Danh sách Các Khóa Học</h2>
<button *ngIf="!showAddCourseForm" (click)="openAddCourseForm()">Thêm Sinh Viên</button>
<div *ngIf="showAddCourseForm">
    <h3>Thêm Thông Tin Sinh Viên</h3>
    // AddCourseForm
    <form #addCourseForm="ngForm" (ngSubmit)="addCourse(addCourseForm.value); closeAddCourseForm()">
        <label>Mã khóa học:</label>
        <input type="text" name="courseId" [(ngModel)]="newCourse.idCourse" required>
        <label>Tên khóa học:</label>
        <input type="text" name="courseName" [(ngModel)]="newCourse.name" required>
        <label>Mô tả:</label>
        <textarea name="description" [(ngModel)]="newCourse.description" required></textarea>
        <label>Link hình ảnh khóa học:</label>
        <input type="text" name="imgUrl" [(ngModel)]="newCourse.imgUrl" required>
        <label>Thời gian khóa học:</label>
        <input type="text" name="courseTime" [(ngModel)]="newCourse.time" required>
        <label>Số buổi học:</label>
        <input type="number" name="numOfLessons" [(ngModel)]="newCourse.numofLessons" required>
        <button type="submit">Lưu</button>
        <button type="button" (click)="closeAddCourseForm()">Huỷ</button>
    </form>
</div>

<div *ngIf="showEditCourseForm">
    <h3>Cập Nhật Thông Tin Khóa Học</h3>
    <form #addCourseForm="ngForm" (ngSubmit)="updateCourse(addCourseForm.value); closeEditCourseForm()">
        <label>Mã khóa học:</label>
        <input type="text" name="courseId" [(ngModel)]="newCourse.idCourse" required>
        <label>Tên khóa học:</label>
        <input type="text" name="courseName" [(ngModel)]="newCourse.name" required>
        <label>Mô tả:</label>
        <textarea name="description" [(ngModel)]="newCourse.description" required></textarea>
        <label>Link hình ảnh khóa học:</label>
        <input type="text" name="imgUrl" [(ngModel)]="newCourse.imgUrl" required>
        <label>Thời gian khóa học:</label>
        <input type="text" name="courseTime" [(ngModel)]="newCourse.time" required>
        <label>Số buổi học:</label>
        <input type="number" name="numOfLessons" [(ngModel)]="newCourse.numofLessons" required>
        <button type="submit">Lưu</button>
        <button type="button" (click)="closeEditCourseForm()">Huỷ</button>
    </form>
</div>



<table class="student-table">
    <thead>
        <tr>
            <th>Mã SV</th>
            <th>Tên sinh viên</th>
            <th>Email</th>
            <th>Password</th>
            <th>Số điện thoại</th>
            <th>Thời gian đăng ký</th>
            <th>Chức năng</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let course of courses">
            <td>{{course.idCourse}}</td>
            <td>{{course.name}}</td>
            <td>{{course.description}}</td>
            <td>{{course.imgUrl}}</td>
            <td>{{course.time}}</td>
            <td>{{course.numofLessons}}</td>
            
            <td>
                <button (click)="deleteCourse(course)" class="btn-delete">Xóa</button>
                <button (click)="openEditCouseForm(course)" class="btn-edit">Sửa</button>
            </td>
        </tr>
    </tbody>
</table>
