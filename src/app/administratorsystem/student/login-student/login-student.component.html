<body>
    <div class="container">

        <div class="login-form">
            <div class="top">
                <h2>Đăng Nhập</h2>
             </div>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="email">Email : </label>
                <input type="email" formControlName="email" class="form-control" placeholder="Nhập địa chỉ email" 
                formControlName = "email">

                <div class="error-list" *ngIf = "f.email.errors && submitted">
                    <div *ngIf="f.email.errors.required">Không được để trống</div>
                    <div *ngIf="f.email.errors.email">Email không đúng</div>
                </div>
            </div>
        
            <div class="form-group">
                <label for="password">Mật khẩu : </label>
                <input type="password" formControlName="password" class="form-control" placeholder="Nhập mật khẩu" 
                formControlName = "password">

                <div class="error-list" *ngIf = "f.password.errors && submitted">
                    <div *ngIf="f.password.errors.required">Không được để trống</div>
                </div>
            </div>
        
            <div class="button">
                <button>Đăng nhập</button>
                <div class="text-danger">{{ error }}</div>
            </div>
            </form>
        </div>
    </div>
</body>
